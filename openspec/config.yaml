schema: spec-driven

context: |
  Astro static site (TypeScript), styled with Tailwind, package-managed with
  bun. Conventional Commits, linted by commitlint. See CONTRIBUTING.md for
  the toolchain, hooks and CI commands, and README.md's "Deploying" section
  for how the site actually ships (GHCR image + private VPS deploy repo for
  production, Cloudflare Workers Builds for PR previews).

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always include a "Non-goals" section
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
