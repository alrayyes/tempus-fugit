StylesPath = styles
MinAlertLevel = warning

# Downloaded by `vale sync`, not committed. The two directories they land in are
# ignored by name in .gitignore rather than ignoring styles/ wholesale, which
# would take styles/House with them.
Packages = Google, proselint

# Vocab is a core option and has to sit above every format section. Put it under
# [*.md] and Vale 3 refuses to start.
Vocab = House

[*.md]
# Google is the general technical-writing style. Microsoft is the alternative for
# API reference, not an addition - running both is two style guides arguing in
# your terminal. proselint sits alongside for the editorial layer: cliches,
# redundancy, corporate speak.
BasedOnStyles = Vale, Google, proselint

# The vocabulary already spells every product name the way it is meant to be
# spelled; this is what holds the prose to it, so "Github" and "javascript" get
# flagged where GitHub and JavaScript are the accepted forms. Without it,
# accept.txt only quiets the spell-checker and any casing passes. It comes from
# the built-in Vale style, so Vale has to stay in BasedOnStyles above.
Vale.Terms = YES

# Passive voice belongs to Vale, and it is switched off in .ltex.json for the
# same reason: two tools underlining the same sentence teaches people to ignore
# both.
#
# No inclusive-language rules here, and none imported through a style. A tool
# that rewrites word choice on someone else's politics is not a correctness
# check and does not get a veto over a merge.

# Google wants dashes closed up, this prose spaces them. That is a house choice
# and Google does not get to overrule it on every paragraph that turns.
Google.EmDash = NO

# "Avoid using 'will'." Google is writing task documentation in the present
# tense; this README is partly about things that have not happened yet - the
# Forgejo migration, what the first release after it will describe - and there
# is no way to say that without the future tense.
Google.Will = NO
