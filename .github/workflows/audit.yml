# Pull requests run the gate and fail only on advisories they add to bun.lock. The
# default branch runs the scan: daily for advisories published against pins that haven't
# moved, on a lockfile push so a merged fix closes the ticket straight away, and by hand.
# Findings live in one open "Dependency advisories" issue. There is no ignore list: an
# advisory with no fix stays in that issue until one ships.
name: audit

on:
  pull_request:
    paths: [package.json, bun.lock, .github/workflows/audit.yml]
  push:
    branches: [master]
    paths: [package.json, bun.lock, .github/workflows/audit.yml]
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # bun audit reads the lockfile, so no install is needed on either side. bun is the
  # version ci.yml pins: a newer one reports advisories the pipeline's doesn't.
  gate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - uses: alrayyes/advisory-scan@9801551dad16ce63853b2babfda885365d368232 # v0.3.0
        with:
          mode: gate
          command: bun audit

  scan:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - uses: alrayyes/advisory-scan@9801551dad16ce63853b2babfda885365d368232 # v0.3.0
        with:
          mode: scan
          command: bun audit
          labels: dependencies
