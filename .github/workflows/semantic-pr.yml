# commitlint checks individual commit messages inside a PR, but never the PR title - and
# on this squash-merge repo, GitHub defaults the squash commit to the PR title. A PR with
# perfectly conventional commits and a title reading "fixed stuff" would squash straight
# past commitlint and land exactly that on master. pull_request_target, not pull_request:
# this needs base-repo permissions to work on PRs opened from forks.
name: semantic-pr

on:
  pull_request_target:
    types: [opened, reopened, edited, synchronize]

permissions:
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  title:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Mirrors @commitlint/config-conventional's type-enum list, so the two checks agree
      # on what's a valid type.
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            build
            chore
            ci
            docs
            feat
            fix
            perf
            refactor
            revert
            style
            test
