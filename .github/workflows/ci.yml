# Translated from .forgejo/workflows/ci.yml for the move to GitHub-canonical. GitHub's
# hosted runners bind-mount a Node.js runtime into every container job automatically, so
# the manual `apk add nodejs` steps Forgejo needed before checkout are gone - they were
# working around Forgejo's runner not doing that. actions/checkout still falls back to a
# tarball download when git isn't present, same as on Forgejo, so only jobs that need real
# history (fetch-depth: 0) or run `git`/`node` themselves still install anything.
name: ci

on:
  pull_request:
  push:
    branches: [master]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # Replaces GitLab's Security/Secret-Detection template by way of Forgejo. gitleaks is
  # what the pre-commit hook already runs, so this is the same check at both ends.
  secrets:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
      options: --entrypoint ""
    steps:
      - run: apk add --no-cache git ca-certificates
      # fetch-depth: 0, and it fails quietly without it - checkout downloads a tarball,
      # there is no history to walk, and the job passes having scanned nothing.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: gitleaks git --redact --no-banner

  # Biome comes from the lockfile, not a container, so this is the same binary the
  # pre-commit hook runs.
  biome:
    runs-on: ubuntu-latest
    container:
      image: oven/bun:1.3.14-alpine@sha256:5acc90a93e91ff07bf72aa90a7c9f0fa189765aec90b47bdbf2152d2196383c0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: bun install --frozen-lockfile
      - run: bunx biome ci --colors=off

  # Pinning stops a version drifting under you; it says nothing about the pinned version
  # having a known CVE. The four ignored advisories are all transitive deps of @lhci/cli
  # (extract-zip, tmp, uuid) - a dev-only tool that never ships in the built artifact.
  # `bun audit fix` can't touch any of them: two are pinned by @lhci/cli's own dependency
  # range and extract-zip has no published fix at all. Revisit via #31 once @lhci/cli
  # updates its own dependencies.
  audit:
    runs-on: ubuntu-latest
    container:
      image: oven/bun:1.3.14-alpine@sha256:5acc90a93e91ff07bf72aa90a7c9f0fa189765aec90b47bdbf2152d2196383c0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: bun install --frozen-lockfile
      - run: |
          bun audit \
            --ignore GHSA-jmr9-qjv8-65gv \
            --ignore GHSA-52f5-9888-hmc6 \
            --ignore GHSA-ph9p-34f9-6g65 \
            --ignore GHSA-w5hq-g745-h8pq

  # The other half of `bun run lint`, which is `biome check && astro check`. Its own job
  # rather than a second command in `biome`: a failing type check and a failing lint rule
  # should be two names in the pipeline, not one.
  astro:
    runs-on: ubuntu-latest
    container:
      image: oven/bun:1.3.14-alpine@sha256:5acc90a93e91ff07bf72aa90a7c9f0fa189765aec90b47bdbf2152d2196383c0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: bun install --frozen-lockfile
      - run: bunx astro check

  dockerfile:
    runs-on: ubuntu-latest
    container:
      image: hadolint/hadolint:v2.14.0-alpine@sha256:7aba693c1442eb31c0b015c129697cb3b6cb7da589d85c7562f9deb435a6657c
      options: --entrypoint ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Rules and the failure threshold come from .hadolint.yaml - the same config the
      # pre-commit hook uses.
      - run: hadolint Dockerfile

  # Layout for the file types Biome does not do: Markdown and YAML, and nothing else.
  # Check mode, never --write - a job that rewrites files leaves the pushed commit and the
  # reviewed diff disagreeing about what was formatted.
  prettier:
    runs-on: ubuntu-latest
    container:
      image: oven/bun:1.3.14-alpine@sha256:5acc90a93e91ff07bf72aa90a7c9f0fa189765aec90b47bdbf2152d2196383c0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: bun install --frozen-lockfile
      - run: bun run format:check

  markdown:
    runs-on: ubuntu-latest
    container:
      image: oven/bun:1.3.14-alpine@sha256:5acc90a93e91ff07bf72aa90a7c9f0fa189765aec90b47bdbf2152d2196383c0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: bun install --frozen-lockfile
      - run: bunx markdownlint-cli2

  # Prose mechanics - grammar, spelling, punctuation, the phonetic article - over
  # LanguageTool's rule database. Fails the pipeline, unlike the style tier, because
  # mechanics have a right answer. CI only, deliberately: a ~320 MB tarball shipping its
  # own JDK is more than a commit should wait on - the editor runs the same engine over
  # LSP. Debian rather than alpine: the bundled JDK is glibc-linked and will not start on
  # musl.
  grammar:
    runs-on: ubuntu-latest
    container:
      image: debian:trixie-slim@sha256:3a39a0592364683e6bab97937b72cad5a8fa6dcbbee90edb3bb48c7f8e94f258
    env:
      LTEX_VERSION: "18.7.0"
    steps:
      - run: apt-get update && apt-get install --no-install-recommends -y ca-certificates curl
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: curl -fsSL -o /tmp/ltex.tar.gz "https://github.com/ltex-plus/ltex-ls-plus/releases/download/${LTEX_VERSION}/ltex-ls-plus-${LTEX_VERSION}-linux-x64.tar.gz"
      - run: tar -xzf /tmp/ltex.tar.gz -C /opt
      # ltex-cli-plus exits 3 when it finds something, not 1, so a job testing for a
      # specific code passes a failing document. Letting any non-zero fail is the test
      # that works.
      - run: |
          find . -name '*.md' \
            -not -path './node_modules/*' \
            -not -path './_site/*' \
            -not -path './styles/Google/*' \
            -not -path './styles/proselint/*' \
            -not -path './.claude/commands/opsx/*' \
            -not -path './.claude/skills/openspec-*/*' \
            -not -path './openspec/changes/*' \
            -not -name 'CHANGELOG.md' \
            -print0 |
            xargs -0 --no-run-if-empty \
              "/opt/ltex-ls-plus-${LTEX_VERSION}/bin/ltex-cli-plus" \
              --client-configuration=.ltex.json

  # Prose style: house voice, weasel words, corporate speak, and the cliches proselint
  # knows. Errors fail and warnings do not: MinAlertLevel in .vale.ini prints the advice,
  # and only Vale.Terms and Vale.Spelling take the job down.
  prose:
    runs-on: ubuntu-latest
    container:
      image: jdkato/vale:v3.17.1@sha256:7dba3c9104ba366f172d119022c4ec53a005f7d14dc1b80e285421a3f0b71657
      options: --entrypoint ""
    steps:
      - run: apk add --no-cache --upgrade ca-certificates
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Fetches Google and proselint into styles/, which is why they are gitignored and
      # why this runs first. styles/House and the vocabulary beside it are committed.
      - run: vale sync
      - run: vale README.md CONTRIBUTING.md

  # Mirrors lefthook's commit-msg hook, which is trivially skipped with --no-verify.
  commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    container:
      image: oven/bun:1.3.14-alpine@sha256:5acc90a93e91ff07bf72aa90a7c9f0fa189765aec90b47bdbf2152d2196383c0
    steps:
      - run: apk add --no-cache ca-certificates git
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # commitlint shells out to git directly (unlike gitleaks, which is unaffected), and
      # hits the same ownership check the release job does - see the note there.
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: bun install --frozen-lockfile
      - run: bunx commitlint --from "${{ github.event.pull_request.base.sha }}" --to HEAD --verbose

  # No container - it needs the docker daemon for scripts/coverage.sh's
  # `docker compose run`, the same reasoning as `smoke`.
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run test:coverage
      # The gate is test:coverage above, which already ran release.bats - uploading the
      # report is reporting, not a check, so a Codecov outage does not take the pipeline
      # down with it. Same call as the lighthouse artifact upload below.
      - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        continue-on-error: true
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/cobertura.xml

  build:
    runs-on: ubuntu-latest
    container:
      image: oven/bun:1.3.14-alpine@sha256:5acc90a93e91ff07bf72aa90a7c9f0fa189765aec90b47bdbf2152d2196383c0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: bun install --frozen-lockfile
      - run: bun run build

  # Tests the served artifact rather than the generator. No container, unlike Forgejo's
  # docker:*-cli image talking to the runner's own dind daemon over a discovered gateway
  # IP - GitHub's hosted ubuntu-latest runners have Docker Engine running natively on the
  # host, so the default socket is already the right one.
  smoke:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - run: sudo apt-get update && sudo apt-get install --no-install-recommends -y bats
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bats test/

  # Audits the built HTML, not the running container. best-practices and performance are
  # hard gates at 0.9. accessibility is turned off here - it's a weighted score that a
  # real violation can survive, and the e2e job below is the actual accessibility gate.
  lighthouse:
    needs: [build]
    runs-on: ubuntu-latest
    container:
      image: oven/bun:1.3.14-alpine@sha256:5acc90a93e91ff07bf72aa90a7c9f0fa189765aec90b47bdbf2152d2196383c0
    env:
      CHROME_PATH: /usr/bin/chromium
    steps:
      - run: apk add --no-cache chromium
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bunx lhci autorun
      # Best-effort, and deliberately so. A report that failed to upload must not take a
      # quality gate down with it - the assertions in lighthouserc.json are the gate and
      # they have already run by this point.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        continue-on-error: true
        with:
          name: lighthouse
          path: .lighthouseci/
          retention-days: 7

  # Playwright journey tests with an axe-core scan folded into each one - see
  # rules/a11y.md for why that's one test rather than a separate a11y suite. No
  # container: Playwright's bundled Chromium is glibc-linked and won't launch on the
  # alpine image the rest of this pipeline uses, so this runs straight on the runner
  # host the same way `smoke` does.
  e2e:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bun run build
      - run: bun run test:e2e

  # Proposes the release as a pull request and, once that PR merges, cuts the actual tag
  # and GitHub Release through the API - never a direct `git push` to master. That's the
  # whole reason this isn't semantic-release: protect-master's ruleset only bypasses
  # Ryan's own user account, never GITHUB_TOKEN's github-actions[bot] identity, so nothing
  # authenticated as GITHUB_TOKEN can push straight to master regardless of what secret
  # backs it. Merging a pull request isn't a direct push and needs no bypass - this repo's
  # ruleset already requires zero approving reviews, so release-auto-merge.yml can merge
  # this PR itself the same way dependabot-auto-merge.yml merges Dependabot's.
  release:
    needs:
      - secrets
      - biome
      - audit
      - astro
      - dockerfile
      - prettier
      - markdown
      - grammar
      - prose
      - coverage
      - build
      - smoke
      - lighthouse
      - e2e
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release

  # Regenerates .github/screenshot.jpg once a release actually lands, rather than on every
  # push to master - the old cadence was never a stated requirement, just an artifact of
  # living inside the job that used to push the release commit directly. Opens its own
  # small pull request instead of committing to master, same reasoning as the release job
  # above: pushing a *new* branch needs no ruleset bypass, only a push to master does, and
  # this is the only place that ever opens a PR shaped this way, so arming its auto-merge
  # inline is simpler than a whole extra workflow file to match one title.
  screenshot:
    needs: [release]
    if: needs.release.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    container:
      image: oven/bun:1.3.14-alpine@sha256:5acc90a93e91ff07bf72aa90a7c9f0fa189765aec90b47bdbf2152d2196383c0
    permissions:
      contents: write
      pull-requests: write
    steps:
      - run: apk add --no-cache ca-certificates git chromium curl
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Screenshot the built site
        run: |
          set -eu
          bun run preview --port 4321 &
          PREVIEW_PID=$!
          for _ in $(seq 1 30); do
            curl -fsS http://localhost:4321/ >/dev/null 2>&1 && break
            sleep 1
          done
          chromium --headless --disable-gpu --no-sandbox --hide-scrollbars \
            --window-size=1280,800 --screenshot=.github/screenshot.jpg \
            http://localhost:4321/
          kill "$PREVIEW_PID"
      - name: Open and auto-merge a PR if the screenshot changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # A plain `git push` here fires the pre-push hook from inside this job, same
          # trap the old release job hit - this image has no docker for the hadolint hook
          # step to reach.
          LEFTHOOK: "0"
        run: |
          set -eu
          if git diff --quiet -- .github/screenshot.jpg; then
            echo "screenshot unchanged"
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          branch="chore/screenshot-${{ github.sha }}"
          git checkout -b "$branch"
          git add .github/screenshot.jpg
          git commit -m "chore: update site screenshot"
          git push origin "$branch"
          pr_url=$(gh pr create --base master --head "$branch" \
            --title "chore: update site screenshot" \
            --body "Retaken after ${{ needs.release.outputs.tag_name }}.")
          gh pr merge --auto --squash "$pr_url"

  # Publishes to GHCR rather than a self-hosted registry, so there's no token to provision
  # either - the automatic per-job token authenticates and pushes on its own once the job
  # has packages: write.
  image:
    needs: [build, smoke]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      # Real analytics values only ever exist here, as repository variables, at the build
      # that actually ships - every other build in this pipeline runs with them unset.
      - name: Build
        env:
          PUBLIC_MATOMO_URL: ${{ vars.PUBLIC_MATOMO_URL }}
          PUBLIC_MATOMO_SITE_ID: ${{ vars.PUBLIC_MATOMO_SITE_ID }}
          PUBLIC_UMAMI_SCRIPT_URL: ${{ vars.PUBLIC_UMAMI_SCRIPT_URL }}
          PUBLIC_UMAMI_WEBSITE_ID: ${{ vars.PUBLIC_UMAMI_WEBSITE_ID }}
        run: bun run build

      - run: docker build --pull -t "ghcr.io/${{ github.repository }}:ci" .

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        id: push
        run: |
          set -eu
          image="ghcr.io/${{ github.repository }}"
          # A ref can carry a slash; a registry tag component cannot.
          slug=$(printf '%s' "${{ github.ref_name }}" | tr '/' '-')
          docker tag "${image}:ci" "${image}:${slug}"
          docker push "${image}:${slug}"

          # The default branch also moves `latest`, which is the tag vps-docker pulls.
          if [ "${{ github.ref }}" = "refs/heads/master" ]; then
            docker tag "${image}:ci" "${image}:latest"
            docker push "${image}:latest"
          fi

          # placeholder/compose.yaml in vps-docker pins by tag *and* digest, so a deploy
          # needs this line. Printing it here saves pulling the image to find out what was
          # just pushed. attest-build-provenance below needs the bare digest too.
          repo_digest=$(docker inspect --format '{{index .RepoDigests 0}}' "${image}:${slug}")
          echo "Pinned form for vps-docker:"
          echo "$repo_digest"
          echo "digest=${repo_digest#*@}" >> "$GITHUB_OUTPUT"

      # SLSA Build L2 provenance, per releases.md's "Build provenance and SBOMs" section -
      # adopt unconditionally on every GitHub repo, no goreleaser/cosign required. Attests
      # this exact digest was built by this workflow run, then attaches the attestation to
      # the image in GHCR (push-to-registry) so anyone pulling it can verify without a
      # separate lookup.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  # Adds the version tag (ghcr.io/…:v1.3.0) to the image `image` already built and pushed
  # above, once release-please-action has actually cut that release on this same run.
  # Deliberately not a separate tag-triggered workflow: a tag release-please creates via
  # the GitHub API using GITHUB_TOKEN never starts a new workflow run - GitHub's own
  # recursion guard suppresses that, the way it suppresses any push GITHUB_TOKEN makes.
  # RELEASE_TOKEN used to sidestep this by accident, being a real PAT rather than
  # GITHUB_TOKEN, and that's gone now (see #36 / migrate-release-please). `imagetools
  # create` copies the manifest under the new tag without rebuilding or even pulling it.
  retag-release-image:
    needs: [release, image]
    if: needs.release.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          set -eu
          image="ghcr.io/${{ github.repository }}"
          docker buildx imagetools create \
            --tag "${image}:${{ needs.release.outputs.tag_name }}" \
            "${image}:latest"
