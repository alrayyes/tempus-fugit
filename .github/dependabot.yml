# Renovate on Forgejo, Dependabot on GitHub - Renovate only runs where it can push, and
# GitHub-primary is invisible to it no matter how it's mirrored.
version: 2
updates:
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # TypeScript 7 dropped the programmatic API @astrojs/check needs - astro check
      # fails outright, not a lint nit. Tracked upstream:
      # https://github.com/withastro/roadmap/discussions/1321
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
